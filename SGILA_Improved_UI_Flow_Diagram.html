<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGILA Improved UI Flow Diagram</title>
  <style>
    body {
      margin: 0;
      background: #ece8dc;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .page {
      width: min(96vw, 1280px);
      margin: 28px auto;
      padding: 18px;
      background: #fffdf5;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(36, 48, 68, .16);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    @media print {
      body { background: white; }
      .page {
        width: auto;
        margin: 0;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
      }
      img { border-radius: 0; }
      @page { size: A3 landscape; margin: 8mm; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img src="SGILA_Improved_UI_Flow_Diagram.svg" alt="SGILA improved UI flow diagram">
  </main>
</body>
</html>
