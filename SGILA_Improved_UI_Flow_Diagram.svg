<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg { fill: #fffdf5; }
      .title { font: 800 34px Segoe UI, Arial, sans-serif; fill: #243044; }
      .subtitle { font: 600 16px Segoe UI, Arial, sans-serif; fill: #6d7482; }
      .lane-title { font: 800 18px Segoe UI, Arial, sans-serif; fill: #243044; }
      .node-title { font: 800 15px Segoe UI, Arial, sans-serif; fill: #243044; }
      .node-sub { font: 600 12px Segoe UI, Arial, sans-serif; fill: #6d7482; }
      .small { font: 700 12px Segoe UI, Arial, sans-serif; fill: #6d7482; }
      .pill-text { font: 800 13px Segoe UI, Arial, sans-serif; fill: #243044; }
      .lane { stroke: #e8e4d6; stroke-width: 2; rx: 26; }
      .node { fill: #ffffff; stroke: #e8e4d6; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .node-main { fill: #fff4c7; stroke: #f8c84b; }
      .node-learner { fill: #ddfbf3; stroke: #6ee0c2; }
      .node-parent { fill: #eee9ff; stroke: #a996ee; }
      .node-teacher { fill: #eaf6ff; stroke: #78b7e8; }
      .node-progress { fill: #ffffff; stroke: #f8c84b; }
      .arrow { fill: none; stroke: #7c8492; stroke-width: 2.4; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #c4bde9; stroke-width: 2.2; marker-end: url(#arrow-soft); }
      .arrow-green { fill: none; stroke: #55b99e; stroke-width: 2.4; marker-end: url(#arrow-green); }
      .arrow-gold { fill: none; stroke: #d9a62e; stroke-width: 2.4; marker-end: url(#arrow-gold); }
      .dash { stroke-dasharray: 7 7; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#243044" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c8492"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a996ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#55b99e"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d9a62e"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1050"/>
  <circle cx="1345" cy="120" r="130" fill="#eee9ff" opacity="0.5"/>
  <circle cx="185" cy="190" r="150" fill="#ddfbf3" opacity="0.55"/>
  <circle cx="1395" cy="905" r="180" fill="#fff4c7" opacity="0.65"/>

  <text x="80" y="72" class="title">SGILA App - Improved UI Flow Diagram</text>
  <text x="80" y="102" class="subtitle">Cleaner role-based navigation flow for learner, parent, teacher, progress tracking, and external services.</text>

  <rect x="60" y="135" width="1480" height="120" class="lane" fill="#fff8dc"/>
  <text x="88" y="170" class="lane-title">Entry &amp; Authentication</text>

  <rect x="115" y="188" width="190" height="46" class="node node-main"/>
  <text x="145" y="216" class="node-title">Welcome / Landing</text>

  <rect x="380" y="176" width="180" height="70" class="node node-main"/>
  <text x="424" y="202" class="node-title">Choose Role</text>
  <text x="411" y="224" class="node-sub">Learner, parent, teacher</text>

  <rect x="635" y="152" width="185" height="58" class="node node-learner"/>
  <text x="684" y="177" class="node-title">Learner Login</text>
  <text x="672" y="197" class="node-sub">Resume reading</text>

  <rect x="875" y="152" width="200" height="58" class="node node-parent"/>
  <text x="913" y="177" class="node-title">Parent Register/Login</text>
  <text x="920" y="197" class="node-sub">Manage child profiles</text>

  <rect x="1130" y="152" width="210" height="58" class="node node-teacher"/>
  <text x="1165" y="177" class="node-title">Teacher Register/Login</text>
  <text x="1185" y="197" class="node-sub">Monitor class progress</text>

  <path d="M305 211 H380" class="arrow-gold"/>
  <path d="M560 194 C590 174, 605 174, 635 181" class="arrow-green"/>
  <path d="M560 211 H875" class="arrow-soft"/>
  <path d="M560 228 C780 265, 1010 244, 1130 190" class="arrow"/>

  <rect x="60" y="300" width="460" height="640" class="lane" fill="#f2fffb"/>
  <text x="88" y="335" class="lane-title">Learner Journey</text>

  <rect x="110" y="365" width="165" height="62" class="node node-learner"/>
  <text x="139" y="390" class="node-title">Grade Home</text>
  <text x="132" y="411" class="node-sub">Available lessons</text>

  <rect x="325" y="365" width="145" height="62" class="node node-learner"/>
  <text x="357" y="390" class="node-title">Select Lesson</text>
  <text x="352" y="411" class="node-sub">Start reading</text>

  <rect x="110" y="475" width="160" height="62" class="node"/>
  <text x="151" y="500" class="node-title">Read Story</text>
  <text x="128" y="521" class="node-sub">Pages, audio, words</text>

  <rect x="325" y="475" width="145" height="62" class="node"/>
  <text x="352" y="500" class="node-title">Questions</text>
  <text x="342" y="521" class="node-sub">Check answers</text>

  <rect x="110" y="585" width="160" height="62" class="node"/>
  <text x="135" y="610" class="node-title">Visual Match</text>
  <text x="126" y="631" class="node-sub">Image to word</text>

  <rect x="325" y="585" width="145" height="62" class="node"/>
  <text x="342" y="610" class="node-title">Pronunciation</text>
  <text x="344" y="631" class="node-sub">Listen and say</text>

  <rect x="110" y="695" width="160" height="62" class="node"/>
  <text x="153" y="720" class="node-title">Spelling</text>
  <text x="123" y="741" class="node-sub">Vowels, letters, copy</text>

  <rect x="325" y="695" width="145" height="62" class="node node-progress"/>
  <text x="352" y="720" class="node-title">Results</text>
  <text x="340" y="741" class="node-sub">Stars + feedback</text>

  <rect x="190" y="815" width="205" height="62" class="node node-progress"/>
  <text x="242" y="840" class="node-title">Progress Saved</text>
  <text x="224" y="861" class="node-sub">Scores, stars, history</text>

  <path d="M275 396 H325" class="arrow-green"/>
  <path d="M397 427 C397 455, 300 454, 270 494" class="arrow-green"/>
  <path d="M270 506 H325" class="arrow-green"/>
  <path d="M397 537 C397 568, 300 566, 270 606" class="arrow-green"/>
  <path d="M270 616 H325" class="arrow-green"/>
  <path d="M397 647 C397 678, 300 676, 270 716" class="arrow-green"/>
  <path d="M270 726 H325" class="arrow-green"/>
  <path d="M397 757 C397 790, 345 790, 300 815" class="arrow-gold"/>
  <path d="M190 815 C70 775, 70 410, 110 396" class="arrow-gold dash"/>

  <rect x="570" y="300" width="430" height="640" class="lane" fill="#f6f2ff"/>
  <text x="598" y="335" class="lane-title">Parent Journey</text>

  <rect x="625" y="365" width="170" height="62" class="node node-parent"/>
  <text x="656" y="390" class="node-title">Parent Dashboard</text>
  <text x="654" y="411" class="node-sub">Child overview cards</text>

  <rect x="840" y="365" width="120" height="62" class="node node-parent"/>
  <text x="866" y="390" class="node-title">Add Child</text>
  <text x="856" y="411" class="node-sub">Create profile</text>

  <rect x="625" y="485" width="170" height="62" class="node"/>
  <text x="651" y="510" class="node-title">View Progress</text>
  <text x="651" y="531" class="node-sub">Scores and stars</text>

  <rect x="840" y="485" width="120" height="62" class="node"/>
  <text x="862" y="510" class="node-title">Reports</text>
  <text x="859" y="531" class="node-sub">History export</text>

  <rect x="685" y="635" width="205" height="62" class="node node-progress"/>
  <text x="728" y="660" class="node-title">Focus Areas</text>
  <text x="720" y="681" class="node-sub">Spot low performance</text>

  <path d="M875 210 C795 245, 710 280, 710 365" class="arrow-soft"/>
  <path d="M795 396 H840" class="arrow-soft"/>
  <path d="M710 427 V485" class="arrow-soft"/>
  <path d="M795 516 H840" class="arrow-soft"/>
  <path d="M710 547 C710 590, 735 610, 770 635" class="arrow-soft"/>
  <path d="M840 396 C740 250, 610 250, 275 396" class="arrow-soft dash"/>

  <rect x="1050" y="300" width="490" height="640" class="lane" fill="#eff8ff"/>
  <text x="1078" y="335" class="lane-title">Teacher Journey</text>

  <rect x="1105" y="365" width="175" height="62" class="node node-teacher"/>
  <text x="1144" y="390" class="node-title">Teacher Dashboard</text>
  <text x="1138" y="411" class="node-sub">Class overview</text>

  <rect x="1330" y="365" width="145" height="62" class="node node-teacher"/>
  <text x="1358" y="390" class="node-title">Learner List</text>
  <text x="1349" y="411" class="node-sub">Filter by grade</text>

  <rect x="1105" y="485" width="175" height="62" class="node"/>
  <text x="1142" y="510" class="node-title">Class Metrics</text>
  <text x="1138" y="531" class="node-sub">Average, activity gaps</text>

  <rect x="1330" y="485" width="145" height="62" class="node"/>
  <text x="1358" y="510" class="node-title">Learner Report</text>
  <text x="1352" y="531" class="node-sub">Individual detail</text>

  <rect x="1105" y="635" width="175" height="62" class="node node-progress"/>
  <text x="1130" y="660" class="node-title">Flag Support Needs</text>
  <text x="1131" y="681" class="node-sub">Low score or inactive</text>

  <rect x="1330" y="635" width="145" height="62" class="node node-progress"/>
  <text x="1362" y="660" class="node-title">Notify Parent</text>
  <text x="1350" y="681" class="node-sub">Reminder / update</text>

  <path d="M1235 210 C1205 255, 1190 300, 1190 365" class="arrow"/>
  <path d="M1280 396 H1330" class="arrow"/>
  <path d="M1190 427 V485" class="arrow"/>
  <path d="M1280 516 H1330" class="arrow"/>
  <path d="M1190 547 V635" class="arrow"/>
  <path d="M1280 666 H1330" class="arrow"/>

  <rect x="575" y="790" width="925" height="125" class="lane" fill="#ffffff"/>
  <text x="605" y="824" class="lane-title">Shared System Services</text>

  <rect x="625" y="850" width="155" height="42" class="node node-main"/>
  <text x="656" y="876" class="pill-text">Session Auth</text>

  <rect x="830" y="850" width="170" height="42" class="node node-main"/>
  <text x="864" y="876" class="pill-text">Lesson Database</text>

  <rect x="1050" y="850" width="175" height="42" class="node node-main"/>
  <text x="1088" y="876" class="pill-text">Progress Store</text>

  <rect x="1275" y="850" width="175" height="42" class="node node-main"/>
  <text x="1306" y="876" class="pill-text">Reports &amp; Alerts</text>

  <path d="M395 846 H625" class="arrow-gold dash"/>
  <path d="M890 697 C960 760, 1030 800, 1135 850" class="arrow-gold dash"/>
  <path d="M1280 697 C1295 750, 1325 805, 1362 850" class="arrow dash"/>
  <path d="M780 871 H830" class="arrow-gold"/>
  <path d="M1000 871 H1050" class="arrow-gold"/>
  <path d="M1225 871 H1275" class="arrow-gold"/>

  <text x="80" y="995" class="small">Design note: each role has its own lane, while shared storage/auth/progress services sit below the user journeys to reduce line crossing.</text>
</svg>
